site_name: SSL Reference
hooks:
  - docs/hooks.py
site_description: Unofficial reference for the STARLIMS Scripting Language (SSL), documenting STARLIMS version 11
site_url: https://mahoskye.github.io/starlims-ssl-reference/
repo_url: https://github.com/mahoskye/starlims-ssl-reference
repo_name: mahoskye/starlims-ssl-reference
edit_uri: edit/main/content/
docs_dir: content
site_dir: _site
exclude_docs: |
  data/
copyright: >
  Copyright &copy; Benjamin Buddle (mahoskye) —
  licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
  Unofficial; not affiliated with STARLIMS. Documents STARLIMS v11 —
  <a href="https://mahoskye.github.io/starlims-ssl-reference/about/">about this reference</a>.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mahoskye/starlims-ssl-reference

