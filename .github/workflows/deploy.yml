name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deploys force-push gh-pages; concurrent runs race and the losers fail.
# Serialize: one deploy at a time, and a newer push supersedes an in-flight one.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdocs gh-deploy --force
